apiVersion: v1
kind: Service
metadata:
  name: ironclad-db
  labels:
    app: ironclad-db
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: grpc
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: ironclad-db
---
apiVersion: v1
kind: Service
metadata:
  name: ironclad-db-headless
  labels:
    app: ironclad-db
spec:
  clusterIP: None
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: grpc
  selector:
    app: ironclad-db
